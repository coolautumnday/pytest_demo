[pytest]
addopts =
    -v
    --no-header
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --video=retain-on-failure
    --self-contained-html


testpaths = testcase
python_files = test_*.py
python_classes = Test*
python_functions = test_*
norecursedirs = venv .git node_modules dist build report test-results
