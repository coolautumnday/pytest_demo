[pytest]
addopts =
    -v
    --no-header
    --tracing=retain-on-failure
    --screenshot=only-on-failure
    --video=retain-on-failure
    --html=report/report.html
    --self-contained-html
    --reruns=3
    --reruns-delay=5


testpaths = testcase
python_files = test_*.py
python_classes = Test*
python_functions = test_*
